pluginManagement {
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        // 4.1: libadblockplus-android (Adblock Plus oficial) se publicaba en
        // jcenter, retirado en 2021. Alibaba public mirror conservaba una
        // copia; si no está, se prueba con jcenter (que sigue sirviendo
        // artefactos existentes en modo solo-lectura). Si ninguno
        // resolviera, la compilación sigue funcionando: el wrapper
        // AdblockPlusEngine usa reflection para detectar la ausencia de
        // las clases AdblockHelper y cae al motor 100% Kotlin (FilterEngine)
        // que ya estaba integrado.
        maven { url "https://maven.aliyun.com/repository/jcenter" }
        maven { url "https://jcenter.bintray.com" }
        google()
        mavenCentral()
    }
}
rootProject.name = "TurboDL"
include(":app")
