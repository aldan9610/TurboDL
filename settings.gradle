dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        // 4.11: motor Brave nativo (AdblockAndroid fork reaver961025). Los
        // AARs del motor van vendidos en app/libs; de JitPack solo se
        // resuelven las dependencias runtime de la librería: HttpRequest
        // (descarga de listas en DownloadWorker) y Timber.
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/jcenter" }
        maven { url "https://jcenter.bintray.com" }
        google()
        mavenCentral()
    }
}
