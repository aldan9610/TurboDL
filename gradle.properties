org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Desde la 3.8.x el reproductor interno usa androidx.media3 (ExoPlayer):
# las dependencias de INTERFAZ siguen siendo sin AndroidX, pero media3
# exige android.useAndroidX=true para su classpath.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# La primera compilacion necesita internet (AGP/Gradle); las dependencias de
# la app ya estan vendidas en app/libs. Despues: gradlew --offline assembleRelease
# (media3 queda en la cache de Gradle tras la primera compilacion)
