plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.turbodl'
    compileSdk 34

    defaultConfig {
        applicationId "com.turbodl"
        // minSdk 26 = Android 8.0: WebView actualizable (base del navegador);
        // Android 5.x-7.x ya no la tienen ni tienen cuota relevante.
        // NOTA 4.1: libadblockplus-android (Adblock Plus oficial) mantiene
        // minSdk 21, así que 26 sigue siendo el cuello de botella. El motor
        // 100% Kotlin (FilterEngine) se conserva como fallback para los
        // dispositivos en los que la librería nativa (V8, ~30 MB) no quepa
        // o no se cargue — el wrapper decide en tiempo de ejecución.
        minSdk 26
        targetSdk 34
        versionCode 32
        versionName "4.13"
    }

    signingConfigs {
        release {
            storeFile file('turbo.keystore')
            storePassword 'turbodl2026'
            keyAlias 'turbo'
            keyPassword 'turbodl2026'
        }
    }

    buildTypes {
        release {
            // R8: reduce APK y RAM (solo se conserva lo usado; las libs
            // criticas se protegen en proguard-rules.pro)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            // 4.2.4: firmar el debug con la MISMA keystore del release
            // (turbo.keystore). Sin esto, el debug se firmaba con la
            // debug.keystore por defecto de Android (~/.android/), que
            // se regenera cuando el sandbox de build se recicla (o entre
            // máquinas), con lo que dos APKs de debug sucesivos podían
            // tener firmas distintas y Android los rechazaba como
            // actualización (INSTALL_FAILED_UPDATE_INCOMPATIBLE), lo
            // que obligaba a desinstalar la versión antigua antes de
            // instalar la nueva. Usando turbo.keystore (estable, en
            // el repo) TODOS los APKs —debug o release— comparten
            // firma y se instalan uno sobre otro sin desinstalar.
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    // 4.3: Robolectric necesita que los tests unitarios tengan acceso
    // a los recursos/manifest de Android y se ejecuten con el runner
    // de AndroidX.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "TurboDL-${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Todas las dependencias estan VENDIDAS en app/libs (compilacion offline):
    //   kotlin-stdlib-1.9.24.jar / jlibtorrent-1.2.0.18.aar (BitTorrent, nativos en jniLibs)
    //   isoparser-1.9.56.jar + slf4j-api-1.7.36.jar (fusion audio+video)
    //   jsoup-1.17.2.jar (exportacion Markdown 4.0)
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    // media3/ExoPlayer (reproductor de video 4.0): resuelto por Gradle
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    // 4.5: androidx.webkit para ProxyController.setProxyOverride — la API
    // oficial (Android 9+ con WebView actualizable) para enrutar TODA la
    // carga del WebView (página + subrecursos) por un proxy HTTP/HTTPS/SOCKS.
    // minSdk 26 sigue: setProxyOverride se ignora en <9, donde el proxy del
    // navegador es el del sistema (sin proxy propio) — documentado en UI.
    implementation 'androidx.webkit:webkit:1.11.0'
    // 4.11: motor de bloqueo nativo Brave (AdblockAndroid, fork
    // reaver961025/AdblockAndroid v2.0.0, LGPL-2.1). Las dos AARs del
    // motor (ad-filter + adblock-client, con libadblock-client.so para
    // arm64/armv7/x86/x86_64) van vendidas en app/libs y entran por el
    // fileTree de arriba. Sus dependencias runtime se resuelven por
    // Gradle: coroutines + serialization (estado de suscripciones),
    // WorkManager (descarga e instalación de listas), Timber (logs) y
    // HttpRequest (com.github.Edsuns, descarga HTTP de las listas).
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.github.Edsuns:HttpRequest:0.2'
    // El usuario elige el motor en Ajustes → Navegador → Motor de
    // bloqueo: Brave (nativo, default), FilterEngine (Kotlin) o Solo
    // hosts. Fallback automático a FilterEngine si el motor nativo
    // falla o el dispositivo tiene < 1,5 GB de RAM.
    // JUnit solo para los tests JVM del motor de bloqueo (no entra en el APK)
    testImplementation 'junit:junit:4.13.2'
    // 4.3: Robolectric para tests JVM que tocan SQLite (NotesDb) sin
    // dispositivo físico. Sólo testImplementation: no entra en el APK.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
}
