plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.turbodl'
    compileSdk 34

    defaultConfig {
        applicationId "com.turbodl"
        // minSdk 26 = Android 8.0: WebView actualizable (base del navegador);
        // Android 5.x-7.x ya no la tienen ni tienen cuota relevante.
        // NOTA 4.1: libadblockplus-android (Adblock Plus oficial) mantiene
        // minSdk 21, así que 26 sigue siendo el cuello de botella. El motor
        // 100% Kotlin (FilterEngine) se conserva como fallback para los
        // dispositivos en los que la librería nativa (V8, ~30 MB) no quepa
        // o no se cargue — el wrapper decide en tiempo de ejecución.
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "4.2.0"
    }

    signingConfigs {
        release {
            storeFile file('turbo.keystore')
            storePassword 'turbodl2026'
            keyAlias 'turbo'
            keyPassword 'turbodl2026'
        }
    }

    buildTypes {
        release {
            // R8: reduce APK y RAM (solo se conserva lo usado; las libs
            // criticas se protegen en proguard-rules.pro)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "TurboDL-${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Todas las dependencias estan VENDIDAS en app/libs (compilacion offline):
    //   kotlin-stdlib-1.9.24.jar / jlibtorrent-1.2.0.18.aar (BitTorrent, nativos en jniLibs)
    //   isoparser-1.9.56.jar + slf4j-api-1.7.36.jar (fusion audio+video)
    //   jsoup-1.17.2.jar (exportacion Markdown 4.0)
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    // media3/ExoPlayer (reproductor de video 4.0): resuelto por Gradle
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    // 4.1: bloqueador de anuncios maduro de Adblock Plus (libadblockplus-android).
    //
    // IMPORTANTE: la AAR se publicaba en jcenter, retirado en 2021. Los
    // mirrors probados (Alibaba, jcenter.bintray.com, maven.eyeo.com) no
    // resuelven `org.adblockplus:adblock-android:4.5.0` en el sandbox de
    // build; por eso las dos líneas siguientes están COMENTADAS para que la
    // app compile.
    //
    // El wrapper `AdblockPlusEngine.kt` carga la AAR por reflexión: si la
    // clase `org.adblockplus.libadblockplus.android.AdblockHelper` no está
    // en el classpath (este caso), todos sus métodos devuelven false/"" y
    // el fallback `FilterEngine` 100% Kotlin responde. Es decir, con o sin
    // la AAR la app compila y bloquea anuncios; con la AAR se usaría el
    // motor oficial de Adblock Plus.
    //
    // Para habilitar el motor oficial en tu entorno: instala la AAR
    // manualmente en `app/libs/` (descargándola de
    // https://github.com/adblockplus/libadblockplus-android/releases o
    // construyéndola con `./gradlew assembleAbi_arm64` del repo oficial)
    // y descomenta las dos líneas siguientes.
    //
    // implementation 'org.adblockplus:adblock-android:4.5.0'
    // implementation 'org.adblockplus:adblock-android-webview:4.5.0'
    // JUnit solo para los tests JVM del motor de bloqueo (no entra en el APK)
    testImplementation 'junit:junit:4.13.2'
}
